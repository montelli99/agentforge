<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>AgentForge — Direction A: Operations Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0e;--bg2:#111114;--bg3:#17171b;--bg4:#1e1e23;--bg5:#26262c;
  --border:#2a2a30;--border2:#333338;
  --t1:#e8e8ec;--t2:#a0a0a8;--t3:#66666e;--t4:#44444c;
  --accent:#6e5eff;--accent2:#5a4de0;--accent-dim:rgba(110,94,255,0.12);
  --green:#3dd68c;--green-dim:rgba(61,214,140,0.1);
  --amber:#f0a030;--amber-dim:rgba(240,160,48,0.1);
  --red:#e04848;--red-dim:rgba(224,72,72,0.1);
  --blue:#48a8f0;--blue-dim:rgba(72,168,240,0.1);
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
  --nav:56px;--top:44px;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--t1);background:var(--bg3);border:1px solid var(--border);padding:6px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.mono{font-family:var(--mono);font-size:11px}

/* ── Layout ─────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:10}
.topbar-brand{font-weight:700;font-size:14px;letter-spacing:-0.02em}
.topbar-sep{width:1px;height:20px;background:var(--border)}
.topbar-env{font-size:11px;color:var(--t3);font-family:var(--mono)}
.topbar-spacer{flex:1}
.topbar-search{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--t3);min-width:200px}
.topbar-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3)}
.topbar-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.topbar-btn{padding:5px 10px;border-radius:5px;font-size:12px;color:var(--t2);transition:all .12s}
.topbar-btn:hover{background:var(--bg4);color:var(--t1)}

/* ── Nav Rail ───────────────────────────────────── */
.nav{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow:hidden}
.nav-item{width:40px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:all .12s;color:var(--t3);position:relative}
.nav-item:hover{background:var(--bg4);color:var(--t2)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item svg{width:18px;height:18px}
.nav-item .badge{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg2)}
.nav-divider{width:24px;height:1px;background:var(--border);margin:4px 0}
.nav-spacer{flex:1}

/* ── Main ───────────────────────────────────────── */
.main{overflow-y:auto;background:var(--bg);padding:20px 24px}
.main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.main-title{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.main-sub{font-size:12px;color:var(--t3);margin-top:2px}

/* ── Cards ──────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--t3)}
.card-grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:1200px){.g4{grid-template-columns:1fr 1fr}}

/* ── Stats ──────────────────────────────────────── */
.stat-row{display:flex;gap:16px;margin-bottom:16px}
.stat{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:0.05em}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-0.03em;margin-top:4px}
.stat-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* ── Badges ─────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.b-green{background:var(--green-dim);color:var(--green)}.b-amber{background:var(--amber-dim);color:var(--amber)}
.b-red{background:var(--red-dim);color:var(--red)}.b-blue{background:var(--blue-dim);color:var(--blue)}
.b-muted{background:var(--bg4);color:var(--t3)}.b-accent{background:var(--accent-dim);color:var(--accent)}

/* ── Buttons ────────────────────────────────────── */
.btn{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--accent);color:white}.btn-p:hover{background:var(--accent2)}
.btn-g{background:var(--bg4);color:var(--t2)}.btn-g:hover{background:var(--bg5);color:var(--t1)}
.btn-d{background:var(--red-dim);color:var(--red)}.btn-d:hover{background:var(--red);color:white}
.btn-s{padding:4px 10px;font-size:11px}

/* ── Table ──────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.tbl tr:hover td{background:var(--bg3)}

/* ── Agent Card ─────────────────────────────────── */
.agent-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .12s}
.agent-row:hover{border-color:var(--accent)}
.agent-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-name{font-weight:600;font-size:13px}
.agent-role{font-size:11px;color:var(--t3)}
.agent-status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%}.dot-g{background:var(--green)}.dot-a{background:var(--amber)}.dot-r{background:var(--red)}.dot-m{background:var(--t3)}

/* ── Timeline ───────────────────────────────────── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;position:relative;padding:8px 0}
.tl-item::before{content:'';position:absolute;left:15px;top:32px;bottom:-8px;width:1px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.tl-dot svg{width:14px;height:14px}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:12px;font-weight:500}
.tl-meta{font-size:11px;color:var(--t3);margin-top:2px}
.tl-detail{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:4px;padding:6px 8px;background:var(--bg);border-radius:4px}

/* ── Approval Card ──────────────────────────────── */
.approval{padding:16px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:6px}
.approval-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.approval-title{font-weight:600;font-size:13px}
.approval-body{font-size:12px;color:var(--t2);margin-bottom:12px}
.approval-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.approval-section{padding:8px 10px;background:var(--bg);border-radius:4px}
.approval-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--t3);margin-bottom:4px}
.approval-item{font-size:11px;color:var(--t2);padding:2px 0}
.approval-actions{display:flex;gap:8px}

/* ── Flow ───────────────────────────────────────── */
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow-node{padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;font-size:12px;font-weight:500;text-align:center;min-width:160px}
.flow-node.active{border-color:var(--accent);background:var(--accent-dim)}
.flow-node.done{border-color:var(--green);background:var(--green-dim)}
.flow-node.warn{border-color:var(--amber);background:var(--amber-dim)}
.flow-arrow{width:1px;height:16px;background:var(--border);position:relative}
.flow-arrow::after{content:'';position:absolute;bottom:-3px;left:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid var(--border)}

/* ── Messages ───────────────────────────────────── */
.msg-layout{display:grid;grid-template-columns:200px 1fr 240px;gap:0;height:calc(100vh - var(--top) - var(--nav));margin:-20px -24px}
.msg-ch{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0}
.msg-ch-group{padding:0 8px}
.msg-ch-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--t3);padding:8px 10px 4px}
.msg-ch-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:4px;font-size:12px;color:var(--t3);cursor:pointer}
.msg-ch-item:hover{background:var(--bg4);color:var(--t2)}
.msg-ch-item.active{background:var(--accent-dim);color:var(--accent)}
.msg-ch-icon{font-size:13px;width:16px;text-align:center}
.msg-conv{display:flex;flex-direction:column;background:var(--bg)}
.msg-conv-head{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.msg-conv-title{font-weight:600;font-size:13px}
.msg-conv-topic{font-size:11px;color:var(--t3)}
.msg-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.bubble-human{background:var(--accent);color:white;align-self:flex-end;border-bottom-right-radius:3px}
.bubble-agent{background:var(--bg3);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:3px}
.bubble-system{background:var(--bg4);align-self:center;font-size:11px;color:var(--t3);padding:4px 12px}
.bubble .sender{font-size:10px;font-weight:600;margin-bottom:3px;opacity:0.8}
.bubble .time{font-size:9px;margin-top:3px;opacity:0.6}
.msg-input{padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2)}
.msg-input input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;font-size:12px}
.msg-ctx{background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:12px}
.msg-ctx-section{margin-bottom:16px}
.msg-ctx-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--t3);margin-bottom:6px}
.ctx-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:var(--t2)}
.transport-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--t3)}

/* ── Migration Steps ────────────────────────────── */
.mig-steps{display:flex;align-items:center;gap:0}
.mig-step{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:11px;font-weight:500;color:var(--t3);border-bottom:2px solid transparent}
.mig-step.done{color:var(--green);border-bottom-color:var(--green)}
.mig-step.active{color:var(--accent);border-bottom-color:var(--accent)}
.mig-step.warn{color:var(--amber);border-bottom-color:var(--amber)}
.mig-step svg{width:14px;height:14px}
.mig-connector{width:20px;height:1px;background:var(--border)}

/* ── Empty ──────────────────────────────────────── */
.empty{text-align:center;padding:32px 16px;color:var(--t3)}
.empty-title{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:4px}

/* ── Helpers ────────────────────────────────────── */
.hidden{display:none!important}
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.text-muted{color:var(--t3)}.text-sm{font-size:11px}.text-xs{font-size:10px}
.w-full{width:100%}
</style>
</head>
<body>
<div class="shell" id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">AgentForge</div>
    <div class="topbar-sep"></div>
    <div class="topbar-env">v0.1.0-alpha</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search agents, tasks, channels...
    </div>
    <div class="topbar-status"><span class="topbar-dot"></span> All systems operational</div>
    <button class="topbar-btn" onclick="showPage('settings')">Settings</button>
  </div>

  <!-- NAV RAIL -->
  <div class="nav">
    <div class="nav-item active" data-page="home" onclick="showPage('home')" title="Operations Briefing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <div class="nav-item" data-page="messages" onclick="showPage('messages')" title="Messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item" data-page="agents" onclick="showPage('agents')" title="Agents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="nav-item" data-page="tasks" onclick="showPage('tasks')" title="Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <div class="nav-item" data-page="approvals" onclick="showPage('approvals')" title="Approvals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span class="badge"></span>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item" data-page="processes" onclick="showPage('processes')" title="Processes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div class="nav-item" data-page="marketplace" onclick="showPage('marketplace')" title="Marketplace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </div>
    <div class="nav-item" data-page="migration" onclick="showPage('migration')" title="Migration">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-item" data-page="settings" onclick="showPage('settings)" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main"></div>
</div>

<script>
const pages = {};

pages.home = () => `
  <div class="main-head">
    <div><div class="main-title">Operations Briefing</div><div class="main-sub">2026-09-20 22:14 UTC — 2 agents active, 1 approval pending</div></div>
    <div class="flex gap-8"><button class="btn btn-g btn-s">Export Report</button></div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="stat-label">Active Agents</div><div class="stat-val">2</div><div class="stat-sub">of 4 total</div></div>
    <div class="stat"><div class="stat-label">Running Tasks</div><div class="stat-val">3</div><div class="stat-sub">1 waiting approval</div></div>
    <div class="stat"><div class="stat-label">Pending Approvals</div><div class="stat-val" style="color:var(--amber)">1</div><div class="stat-sub">medium risk</div></div>
    <div class="stat"><div class="stat-label">Completed Today</div><div class="stat-val" style="color:var(--green)">7</div><div class="stat-sub">0 failed</div></div>
    <div class="stat"><div class="stat-label">Token Spend</div><div class="stat-val">$0.42</div><div class="stat-sub">12,840 tokens</div></div>
  </div>

  <div class="card-grid g2">
    <div class="card">
      <div class="card-head"><div class="card-title">Active Agents</div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="agent-row" onclick="showPage('agent-detail')">
          <div class="agent-icon" style="background:#4a6fa5">FD</div>
          <div class="agent-info"><div class="agent-name">Forge Developer</div><div class="agent-role">Full-Stack Engineer</div></div>
          <div class="agent-status"><span class="dot dot-g"></span> Working</div>
        </div>
        <div class="agent-row">
          <div class="agent-icon" style="background:#6b8e5a">SA</div>
          <div class="agent-info"><div class="agent-name">Sarah</div><div class="agent-role">Acquisitions Specialist</div></div>
          <div class="agent-status"><span class="dot dot-a"></span> Waiting</div>
        </div>
        <div class="agent-row">
          <div class="agent-icon" style="background:#8b6e5a">RA</div>
          <div class="agent-info"><div class="agent-name">Research Agent</div><div class="agent-role">Analysis</div></div>
          <div class="agent-status"><span class="dot dot-m"></span> Idle</div>
        </div>
        <div class="agent-row">
          <div class="agent-icon" style="background:#5a6e8b">VR</div>
          <div class="agent-info"><div class="agent-name">Voice Receptionist</div><div class="agent-role">Calls</div></div>
          <div class="agent-status"><span class="dot dot-m"></span> Offline</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">Needs Attention</div></div>
