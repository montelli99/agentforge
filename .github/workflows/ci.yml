name: AgentForge CI

on:
  workflow_dispatch:
  push:
    branches: [ master, main, vnext ]
  pull_request:
    branches: [ master, main, vnext ]

permissions:
  contents: read

jobs:
  public-acceptance:
    name: Public package and isolated execution acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Clean Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated acceptance images
        run: |
          docker pull alpine:latest
          docker pull node:22-alpine

      # This gate inspects the exact npm archive and exercises the approved
      # execution path in a network-disabled Docker container.
      - name: Verify public release boundary
        run: pnpm verify:public
        env:
          NODE_ENV: test
          CI: true
          OPENAI_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          DISCORD_BOT_TOKEN: ""

      - name: Verify Docker survivor discovery after worker death
        run: pnpm test:execution:docker-crash

      - name: Prepare isolated browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify memory setup and reload in Chromium
        run: |
          export AGENTFORGE_BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath());")"
          pnpm test:memory:browser
          pnpm test:connections:browser
          AGENTFORGE_BROWSER_LOCAL=1 pnpm test:connections:browser
          pnpm test:approval:browser
          pnpm test:migration:browser

      - name: Retain synthetic browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: memory-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/agentforge-memory-browser-*/memory-import.png
          if-no-files-found: error

      - name: Package exact verified commit
        run: |
          mkdir -p release-output
          npm pack --pack-destination release-output
          git rev-parse HEAD > release-output/COMMIT.txt
          sha256sum release-output/*.tgz > release-output/SHA256SUMS.txt

      - name: Retain verified release package
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-output/

  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Clean Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and build
        run: pnpm check
        env:
          NODE_ENV: test
          CI: true
          # Zero production secrets required; providers run in deterministic test mode
          OPENAI_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
          DISCORD_BOT_TOKEN: ""

      - name: Verify interrupted execution is not replayed
        run: pnpm test:execution:crash

      - name: Verify built-launcher persistence across restart
        run: pnpm test:persistence:launcher
        env:
          NODE_ENV: test
          CI: true

      - name: Verify package developer CLI workflow
        run: pnpm test:package:cli
        env:
          NODE_ENV: test
          CI: true

      - name: Validate local Windows watchdog syntax
        run: node --check scripts/agentforge-watchdog.mjs

      - name: Verify Working Tree Cleanliness
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after tests!"
            git status
            exit 1
          fi
